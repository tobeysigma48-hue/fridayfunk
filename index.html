<!doctype html>
<html lang="en">
<head>
  <base href="https://tobeysigma48-hue.github.io/fridayfunk/">

  <meta charset="utf-8">
  <title>Friday Night Funkin'</title>

  <meta
    id="viewport"
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #openfl-content {
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>

<body>

  <div id="openfl-content"></div>

  <script src="Funkin.js"></script>

  <script>
    window.addEventListener("touchmove", function(event) {
      event.preventDefault();
    }, {
      capture: false,
      passive: false
    });

    if (
      typeof window.devicePixelRatio !== "undefined" &&
      window.devicePixelRatio > 2
    ) {
      var meta = document.getElementById("viewport");

      meta.setAttribute(
        "content",
        "width=device-width, initial-scale=" +
        2 / window.devicePixelRatio +
        ", user-scalable=no"
      );
    }

    window.addEventListener("load", function() {
      if (typeof lime === "undefined") {
        console.error("Lime did not load.");
        return;
      }

      lime.embed(
        "Funkin",
        "openfl-content",
        1280,
        720,
        { parameters: {} }
      );
    });
  </script>

</body>
</html>
